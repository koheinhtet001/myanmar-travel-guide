<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

    <h1>Contact Us</h1>

    <div class="container">

        <input type="text" placeholder="Your Name">

        <br>

        <input type="email" placeholder="Your Email">

        <br>

        <textarea rows="5" placeholder="Your Message"></textarea>

        <br>

        <button>Send Message</button>

        <br><br>

        <a href="index.html">
            <button>⬅ Back Home</button>
        </a>

    </div>

</body>
</html>
