<!DOCTYPE html>
<html>
<head>
    <title>Myanmar Travel Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            margin: 0;
        }

        h1 {
            color: darkblue;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: blue;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>Myanmar Travel Gallery</h1>

<div class="gallery">
    <img src="inle.jpg" alt="Inle Lake">
    <img src="Bagan.jpg" alt="Bagan">
    <img src="Ngapali.jpg" alt="Ngapali">
    <img src="Shwedagon.jpg" alt="Shwedagon">
    <img src="uppatasanti Pagoda.jpg" alt="Uppatasanti">
    <img src="PUTAO.jpg" alt="Putao">
    <img src="kanbawzathadi.jpg" alt="Kanbawzathadi Palace">
</div>

<a class="btn" href="index.html">⬅ Back Home</a>

</body>
</html>
